  <!-- Col 8 x=680 -->
  <text class="mc col8" x="680" y="20">A</text><text class="mc col8" x="680" y="35">N</text><text class="mc col8" x="680" y="50">O</text><text class="mc col8" x="680" y="65">M</text><text class="mc col8" x="680" y="80">A</text><text class="hd hd8" x="680" y="95">L</text><text class="mc col8" x="680" y="110">Y</text><text class="mc col8" x="680" y="125">9</text><text class="mc col8" x="680" y="140">7</text><text class="mc col8" x="680" y="155">%</text>
  <!-- Col 9 x=710 -->
  <text class="mc col9" x="710" y="20">∑</text><text class="mc col9" x="710" y="35">I</text><text class="mc col9" x="710" y="50">P</text><text class="mc col9" x="710" y="65">0</text><text class="mc col9" x="710" y="80">1</text><text class="mc col9" x="710" y="95">P</text><text class="hd hd9" x="710" y="110">K</text><text class="mc col9" x="710" y="125">T</text><text class="mc col9" x="710" y="140">≠</text><text class="mc col9" x="710" y="155">0</text>
  <!-- Col 10 x=740 -->
  <text class="mc col10" x="740" y="20">G</text><text class="mc col10" x="740" y="35">E</text><text class="mc col10" x="740" y="50">O</text><text class="hd hd10" x="740" y="65">I</text><text class="mc col10" x="740" y="80">P</text><text class="mc col10" x="740" y="95">∆</text><text class="mc col10" x="740" y="110">0</text><text class="mc col10" x="740" y="125">1</text><text class="mc col10" x="740" y="140">∫</text><text class="mc col10" x="740" y="155">R</text>
  <!-- Col 11 x=770 -->
  <text class="mc col11" x="770" y="20">T</text><text class="mc col11" x="770" y="35">C</text><text class="hd hd11" x="770" y="50">P</text><text class="mc col11" x="770" y="65">U</text><text class="mc col11" x="770" y="80">D</text><text class="mc col11" x="770" y="95">P</text><text class="mc col11" x="770" y="110">0</text><text class="mc col11" x="770" y="125">1</text><text class="mc col11" x="770" y="140">∇</text>
  <!-- Col 12 x=800 -->
  <text class="mc col12" x="800" y="20">∫</text><text class="mc col12" x="800" y="35">B</text><text class="mc col12" x="800" y="50">P</text><text class="mc col12" x="800" y="65">F</text><text class="hd hd12" x="800" y="80">≡</text><text class="mc col12" x="800" y="95">0</text><text class="mc col12" x="800" y="110">1</text><text class="mc col12" x="800" y="125">S</text><text class="mc col12" x="800" y="140">N</text><text class="mc col12" x="800" y="155">F</text>
  <!-- Col 13 x=830 -->
  <text class="mc col13" x="830" y="20">H</text><text class="mc col13" x="830" y="35">A</text><text class="mc col13" x="830" y="50">S</text><text class="mc col13" x="830" y="65">H</text><text class="mc col13" x="830" y="80">0</text><text class="mc col13" x="830" y="95">1</text><text class="hd hd13" x="830" y="110">∑</text><text class="mc col13" x="830" y="125">D</text><text class="mc col13" x="830" y="140">N</text><text class="mc col13" x="830" y="155">S</text>
