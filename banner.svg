  <text class="mc col5" x="160" y="20">@</text><text class="mc col5" x="160" y="35">S</text><text class="mc col5" x="160" y="50">C</text><text class="hd hd5" x="160" y="65">A</text><text class="mc col5" x="160" y="80">P</text><text class="mc col5" x="160" y="95">Y</text><text class="mc col5" x="160" y="110">∑</text><text class="mc col5" x="160" y="125">0</text><text class="mc col5" x="160" y="140">1</text><text class="mc col5" x="160" y="155">#</text>
  <!-- Col 6 x=190 -->
  <text class="mc col6" x="190" y="20">∂</text><text class="hd hd6" x="190" y="35">W</text><text class="mc col6" x="190" y="50">S</text><text class="mc col6" x="190" y="65">0</text><text class="mc col6" x="190" y="80">1</text><text class="mc col6" x="190" y="95">∇</text><text class="mc col6" x="190" y="110">P</text><text class="mc col6" x="190" y="125">K</text><text class="mc col6" x="190" y="140">T</text>
  <!-- Col 7 x=220 -->
  <text class="mc col7" x="220" y="20">R</text><text class="mc col7" x="220" y="35">A</text><text class="mc col7" x="220" y="50">W</text><text class="mc col7" x="220" y="65">0</text><text class="mc col7" x="220" y="80">1</text><text class="hd hd7" x="220" y="95">≡</text><text class="mc col7" x="220" y="110">F</text><text class="mc col7" x="220" y="125">L</text><text class="mc col7" x="220" y="140">O</text><text class="mc col7" x="220" y="155">W</text>

