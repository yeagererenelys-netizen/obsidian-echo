<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&amp;family=Orbitron:wght@900&amp;display=swap');

      .bg { fill: #000; }
      .border-rect { fill: none; stroke: #a3ff12; stroke-width: 1; opacity: 0; animation: borderAppear 0.5s 0.2s forwards; }
      .scan { fill: none; stroke: rgba(163,255,18,0.15); stroke-width: 1.5; animation: scanDown 4s linear infinite; }

      /* Matrix column chars */
      .mc { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; fill: #a3ff12; opacity: 0; }

      .col0  { animation: mf 2.1s 0.0s infinite; }
      .col1  { animation: mf 1.8s 0.3s infinite; }
      .col2  { animation: mf 2.4s 0.7s infinite; }
      .col3  { animation: mf 1.6s 0.1s infinite; }
      .col4  { animation: mf 2.7s 0.9s infinite; }
      .col5  { animation: mf 1.9s 0.4s infinite; }
      .col6  { animation: mf 2.2s 1.1s infinite; }
      .col7  { animation: mf 1.7s 0.6s infinite; }
      .col8  { animation: mf 2.5s 0.2s infinite; }
      .col9  { animation: mf 2.0s 1.3s infinite; }
      .col10 { animation: mf 1.5s 0.8s infinite; }
      .col11 { animation: mf 2.3s 0.5s infinite; }
      .col12 { animation: mf 1.8s 1.5s infinite; }
      .col13 { animation: mf 2.6s 0.0s infinite; }
      .col14 { animation: mf 2.0s 1.2s infinite; }
      .col15 { animation: mf 1.6s 0.7s infinite; }
      .col16 { animation: mf 2.9s 0.3s infinite; }
      .col17 { animation: mf 1.7s 1.0s infinite; }
      .col18 { animation: mf 2.1s 0.6s infinite; }
      .col19 { animation: mf 2.4s 1.4s infinite; }
      .col20 { animation: mf 1.9s 0.9s infinite; }
      .col21 { animation: mf 2.2s 0.2s infinite; }
      .col22 { animation: mf 1.6s 1.6s infinite; }
      .col23 { animation: mf 2.8s 0.5s infinite; }
      .col24 { animation: mf 2.0s 1.1s infinite; }
      .col25 { animation: mf 1.8s 0.4s infinite; }
      .col26 { animation: mf 2.5s 0.8s infinite; }
      .col27 { animation: mf 1.5s 1.3s infinite; }
      .col28 { animation: mf 2.3s 0.1s infinite; }
      .col29 { animation: mf 2.1s 1.7s infinite; }

      /* Bright head char */
      .hd { fill: #ffffff; filter: url(#gBright); }
      .hd0  { animation: mf 2.1s 0.0s infinite; }
      .hd1  { animation: mf 1.8s 0.3s infinite; }
      .hd2  { animation: mf 2.4s 0.7s infinite; }
      .hd3  { animation: mf 1.6s 0.1s infinite; }
      .hd4  { animation: mf 2.7s 0.9s infinite; }
      .hd5  { animation: mf 1.9s 0.4s infinite; }
      .hd6  { animation: mf 2.2s 1.1s infinite; }
      .hd7  { animation: mf 1.7s 0.6s infinite; }
      .hd8  { animation: mf 2.5s 0.2s infinite; }
      .hd9  { animation: mf 2.0s 1.3s infinite; }
      .hd10 { animation: mf 1.5s 0.8s infinite; }
      .hd11 { animation: mf 2.3s 0.5s infinite; }
      .hd12 { animation: mf 1.8s 1.5s infinite; }
      .hd13 { animation: mf 2.6s 0.0s infinite; }
      .hd14 { animation: mf 2.0s 1.2s infinite; }
      .hd15 { animation: mf 1.6s 0.7s infinite; }
      .hd16 { animation: mf 2.9s 0.3s infinite; }
      .hd17 { animation: mf 1.7s 1.0s infinite; }
      .hd18 { animation: mf 2.1s 0.6s infinite; }
      .hd19 { animation: mf 2.4s 1.4s infinite; }
      .hd20 { animation: mf 1.9s 0.9s infinite; }
      .hd21 { animation: mf 2.2s 0.2s infinite; }
      .hd22 { animation: mf 1.6s 1.6s infinite; }
      .hd23 { animation: mf 2.8s 0.5s infinite; }
      .hd24 { animation: mf 2.0s 1.1s infinite; }
      .hd25 { animation: mf 1.8s 0.4s infinite; }
      .hd26 { animation: mf 2.5s 0.8s infinite; }
      .hd27 { animation: mf 1.5s 1.3s infinite; }
      .hd28 { animation: mf 2.3s 0.1s infinite; }
      .hd29 { animation: mf 2.1s 1.7s infinite; }

      @keyframes mf {
        0%   { opacity: 0; }
        10%  { opacity: 0.6; }
        50%  { opacity: 0.3; }
        80%  { opacity: 0.7; }
        100% { opacity: 0; }
      }

      @keyframes borderAppear {
        to { opacity: 1; }
      }

      @keyframes scanDown {
        0%   { transform: translateY(-10px); opacity: 0; }
        5%   { opacity: 1; }
        90%  { opacity: 0.4; }
        100% { transform: translateY(290px); opacity: 0; }
      }

      /* Title */
      .title {
        font-family: 'Orbitron', 'JetBrains Mono', monospace;
        font-weight: 900;
        font-size: 62px;
        fill: #a3ff12;
        letter-spacing: 6px;
        filter: url(#glow);
        opacity: 0;
        animation: titleIn 0.8s 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
      }
      @keyframes titleIn {
        0%   { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .subtitle {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 13px;
        fill: #6abf0a;
        letter-spacing: 5px;
        opacity: 0;
        animation: titleIn 0.7s 1.0s ease forwards;
      }

      .tagline {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 11px;
        fill: #444;
        letter-spacing: 3px;
        opacity: 0;
        animation: titleIn 0.7s 1.3s ease forwards;
      }

      /* Bracket decorations */
      .bracket {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 68px;
        fill: none;
        stroke: #a3ff12;
        stroke-width: 1.5;
        opacity: 0;
        animation: titleIn 0.6s 0.9s ease forwards;
        filter: url(#glowSoft);
      }

      /* Corner marks */
      .corner { fill: none; stroke: #a3ff12; stroke-width: 1.5; opacity: 0; animation: cornerIn 0.4s ease forwards; }
      .c-tl { animation-delay: 0.2s; }
      .c-tr { animation-delay: 0.3s; }
      .c-bl { animation-delay: 0.4s; }
      .c-br { animation-delay: 0.5s; }
      @keyframes cornerIn { to { opacity: 1; } }

      /* Live dot */
      .live-dot { fill: #a3ff12; filter: url(#glow); animation: livePulse 1.4s infinite; }
      @keyframes livePulse { 0%,100%{opacity:1;r:4} 50%{opacity:0.3;r:3} }

      .live-text {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 9px;
        fill: #6abf0a;
        letter-spacing: 2px;
        opacity: 0;
        animation: titleIn 0.5s 1.6s ease forwards;
      }

      /* Horizontal line */
      .hline {
        stroke: #a3ff12;
        stroke-width: 0.5;
        opacity: 0;
        animation: lineGrow 0.8s 1.2s ease forwards;
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
      }
      @keyframes lineGrow {
        to { stroke-dashoffset: 0; opacity: 0.4; }
      }

      /* Glitch layers */
      .glitch1 {
        font-family: 'Orbitron', 'JetBrains Mono', monospace;
        font-weight: 900;
        font-size: 62px;
        fill: #ef4444;
        letter-spacing: 6px;
        opacity: 0;
        animation: glitch1 6s 2s infinite;
      }
      .glitch2 {
        font-family: 'Orbitron', 'JetBrains Mono', monospace;
        font-weight: 900;
        font-size: 62px;
        fill: #00ff41;
        letter-spacing: 6px;
        opacity: 0;
        animation: glitch2 6s 2s infinite;
      }
      @keyframes glitch1 {
        0%,89%,100% { opacity:0; transform:translate(0,0); clip-path: none; }
        90% { opacity:0.7; transform:translate(-3px,-1px); clip-path: polygon(0 20%,100% 20%,100% 40%,0 40%); }
        92% { opacity:0; }
        95% { opacity:0.5; transform:translate(2px,1px); clip-path: polygon(0 60%,100% 60%,100% 75%,0 75%); }
        97% { opacity:0; }
      }
      @keyframes glitch2 {
        0%,89%,100% { opacity:0; transform:translate(0,0); clip-path: none; }
        91% { opacity:0.6; transform:translate(3px,2px); clip-path: polygon(0 55%,100% 55%,100% 70%,0 70%); }
        93% { opacity:0; }
        96% { opacity:0.4; transform:translate(-2px,-1px); clip-path: polygon(0 10%,100% 10%,100% 30%,0 30%); }
        98% { opacity:0; }
      }
    </style>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gBright" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="1"/>
      <stop offset="18%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="82%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="1"/>
    </linearGradient>
    <mask id="mL"><rect width="900" height="280" fill="url(#fadeL)"/></mask>
    <mask id="mR"><rect width="900" height="280" fill="url(#fadeR)"/></mask>
  </defs>

  <!-- Background -->
  <rect class="bg" width="900" height="280"/>

  <!-- ── Matrix rain columns ── -->
  <!-- Col 0 x=10 -->
  <text class="mc col0" x="10" y="20">P</text><text class="mc col0" x="10" y="35">A</text><text class="mc col0" x="10" y="50">C</text><text class="mc col0" x="10" y="65">K</text><text class="mc col0" x="10" y="80">1</text><text class="mc col0" x="10" y="95">0</text><text class="mc col0" x="10" y="110">T</text><text class="mc col0" x="10" y="125">∆</text><text class="mc col0" x="10" y="140">E</text><text class="mc col0" x="10" y="155">#</text><text class="mc col0" x="10" y="170">S</text><text class="mc col0" x="10" y="185">C</text><text class="mc col0" x="10" y="200">O</text><text class="mc col0" x="10" y="215">P</text><text class="mc col0" x="10" y="230">E</text><text class="hd hd0" x="10" y="245">1</text><text class="mc col0" x="10" y="260">0</text>
  <!-- Col 1 x=40 -->
  <text class="mc col1" x="40" y="20">0</text><text class="mc col1" x="40" y="35">1</text><text class="mc col1" x="40" y="50">∑</text><text class="mc col1" x="40" y="65">N</text><text class="mc col1" x="40" y="80">E</text><text class="mc col1" x="40" y="95">T</text><text class="mc col1" x="40" y="110">W</text><text class="mc col1" x="40" y="125">O</text><text class="mc col1" x="40" y="140">R</text><text class="mc col1" x="40" y="155">K</text><text class="mc col1" x="40" y="170">1</text><text class="mc col1" x="40" y="185">0</text><text class="hd hd1" x="40" y="200">∂</text><text class="mc col1" x="40" y="215">1</text><text class="mc col1" x="40" y="230">0</text>
  <!-- Col 2 x=70 -->
  <text class="mc col2" x="70" y="20">∇</text><text class="mc col2" x="70" y="35">F</text><text class="mc col2" x="70" y="50">O</text><text class="mc col2" x="70" y="65">R</text><text class="mc col2" x="70" y="80">E</text><text class="mc col2" x="70" y="95">N</text><text class="mc col2" x="70" y="110">S</text><text class="mc col2" x="70" y="125">I</text><text class="mc col2" x="70" y="140">C</text><text class="hd hd2" x="70" y="155">S</text><text class="mc col2" x="70" y="170">∆</text><text class="mc col2" x="70" y="185">0</text><text class="mc col2" x="70" y="200">1</text>
  <!-- Col 3 x=100 -->
  <text class="mc col3" x="100" y="20">≡</text><text class="mc col3" x="100" y="35">B</text><text class="mc col3" x="100" y="50">E</text><text class="mc col3" x="100" y="65">A</text><text class="mc col3" x="100" y="80">C</text><text class="mc col3" x="100" y="95">O</text><text class="mc col3" x="100" y="110">N</text><text class="hd hd3" x="100" y="125">0</text><text class="mc col3" x="100" y="140">1</text><text class="mc col3" x="100" y="155">0</text><text class="mc col3" x="100" y="170">≠</text>
