  <text class="glitch2" x="450" y="155" text-anchor="middle">WhereIsMyPacket</text>

  <!-- Main title -->
  <text class="title" x="450" y="155" text-anchor="middle">WhereIsMyPacket</text>

  <!-- Subtitle -->
  <text class="subtitle" x="450" y="183" text-anchor="middle">NETWORK FORENSICS ENGINE</text>

  <!-- Tagline -->
  <text class="tagline" x="450" y="220" text-anchor="middle">SEE EVERYTHING  ·  MISS NOTHING</text>

  <!-- Live indicator -->
