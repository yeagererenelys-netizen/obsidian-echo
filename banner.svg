  <!-- Fade masks over left and right matrix columns -->
  <rect width="250" height="280" fill="url(#fadeL)"/>
  <rect x="650" width="250" height="280" fill="url(#fadeR)"/>

  <!-- Scan line -->
  <line class="scan" x1="0" y1="0" x2="900" y2="0"/>

  <!-- Corner marks -->
  <polyline class="corner c-tl" points="0,20 0,0 20,0"/>
  <polyline class="corner c-tr" points="880,0 900,0 900,20"/>
  <polyline class="corner c-bl" points="0,260 0,280 20,280"/>
  <polyline class="corner c-br" points="880,280 900,280 900,260"/>

  <!-- Border rect -->
  <rect class="border-rect" x="0.5" y="0.5" width="899" height="279" rx="0"/>

  <!-- Horizontal separator lines -->
  <line class="hline" x1="50" y1="198" x2="850" y2="198"/>
  <line class="hline" x1="50" y1="200" x2="850" y2="200" style="animation-delay: 1.25s"/>

  <!-- Glitch layers (behind title) -->
