  <text class="mc col4" x="130" y="20">1</text><text class="mc col4" x="130" y="35">C</text><text class="mc col4" x="130" y="50">2</text><text class="mc col4" x="130" y="65">∫</text><text class="hd hd4" x="130" y="80">D</text><text class="mc col4" x="130" y="95">E</text><text class="mc col4" x="130" y="110">T</text><text class="mc col4" x="130" y="125">E</text><text class="mc col4" x="130" y="140">C</text><text class="mc col4" x="130" y="155">T</text><text class="mc col4" x="130" y="170">0</text><text class="mc col4" x="130" y="185">1</text>
